name: Build Windows GUI

on:
  push:
    branches:
      - main
      - claude/practical-ritchie-PC4Ux
    paths:
      - 'jellyfin-rpc/**'
      - 'jellyfin-rpc-gui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-gui-windows.yml'
  pull_request:
  workflow_dispatch:

jobs:
  windows-gui:
    name: Build Windows GUI (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-gui-

      - name: Build GUI in release mode
        run: cargo build -p jellyfin-rpc-gui --release --locked

      - name: Rename binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\jellyfin-rpc-gui.exe dist\Jellyfin-RPC-GUI.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin-RPC-GUI-windows-x86_64
          path: dist/Jellyfin-RPC-GUI.exe
          if-no-files-found: error
