[package]
name = "jellyfin-rpc-gui"
version = "1.3.5"
edition = "2021"
description = "Graphical interface for Jellyfin-RPC with system tray support"
license = "GPL-3.0-or-later"
repository = "https://github.com/JustRadical/jellyfin-rpc"

[[bin]]
name = "jellyfin-rpc-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
jellyfin-rpc = { path = "../jellyfin-rpc", version = "1.3.5" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
